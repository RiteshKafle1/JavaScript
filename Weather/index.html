<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="weather.png">
  <title>Weather App</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <!-- <h1>Weather APP</h1> -->
  <div class="main-container">
    <div class="card-container">
      <div class="search">
        <input type="text" id="inputfield" placeholder="Enter city here" spellcheck="false"  name="city">
        <button id="btn" type="submit">
          <img src="search.png" alt="search-icon">
        </button>
        
      </div>
      <div class="error">City Not Found</div>
      <div class="weather">
        <img src="cloudy.png" alt="rain-image" class="weather-icon">
        <h1 class="temp">22</h1>
        <h2 class="city">Nepal</h2>


        <div class="col">
          <img src="humidity.png" alt="humidity-img">
          <div>
            <h1 class="humidity-value">50</h1>
            <h2 class="humidity-text">Humidity</h2>
          </div>

          <img src="wind.png" alt="humidity-img">
          <div class="wind-container">
            <h1 class="wind">50</h1>
            <h2 class="wind-text">Wind Speed</h2>
          </div>
        </div>





      </div>





    </div>
  </div>


  <script src="index.js"></script>
</body>

</html>
